<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadRacerv1</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, #14233d 0%, #070d18 58%);
      font-family: Arial, Helvetica, sans-serif;
      color: #edf7ff;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game {
      position: relative;
      width: 420px;
      height: 720px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.12);
      background: #090e1a;
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#1b2439, #0c1018);
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 5;
      pointer-events: none;
    }

    .stat {
      min-width: 92px;
      background: rgba(10, 16, 27, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 7px 10px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .value {
      display: block;
      font-size: 24px;
      margin-top: 2px;
      font-weight: 700;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 5, 12, 0.62);
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      width: 300px;
      background: rgba(15, 22, 38, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .panel h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    .panel p {
      margin: 8px 0;
      font-size: 15px;
      opacity: 0.8;
    }

    button {
      margin-top: 18px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2ed4ff, #2d6bff);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(45,107,255,0.35);
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Best</span>
        <span id="best" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Speed</span>
        <span id="speed" class="value">0</span>
      </div>
    </div>

    <canvas id="canvas" width="420" height="720"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1 id="title">Neon Racer</h1>
        <p id="message">Use A/D or Left/Right to steer</p>
        <p>Hold Space to boost</p>
        <button id="startBtn">Start Race</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const speedEl = document.getElementById("speed");
    const overlay = document.getElementById("overlay");
    const titleEl = document.getElementById("title");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");

    const road = {
      left: canvas.width / 2 - 110,
      width: 220,
      laneCount: 3,
      scroll: 0,
      speed: 5
    };

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 120,
      w: 38,
      h: 66,
      velX: 0,
      boost: 100
    };

    const keys = {
      left: false,
      right: false,
      boost: false
    };

    let running = false;
    let score = 0;
    let best = Number(localStorage.getItem("neon_racer_best")) || 0;
    let traffic = [];
    let particles = [];
    let lastTime = 0;
    let spawnTimer = 0;

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function updateHUD() {
      scoreEl.textContent = Math.floor(score);
      bestEl.textContent = Math.floor(best);
      speedEl.textContent = Math.floor(road.speed * 12) + " km/h";
    }

    function startGame() {
      running = true;
      score = 0;
      road.speed = 5;
      road.scroll = 0;
      spawnTimer = 0;
      traffic = [];
      particles = [];
      player.x = canvas.width / 2;
      player.velX = 0;
      player.boost = 100;

      overlay.classList.add("hidden");
      updateHUD();
    }

    function endGame() {
      running = false;

      if (score > best) {
        best = score;
        localStorage.setItem("neon_racer_best", String(best));
      }

      overlay.classList.remove("hidden");
      titleEl.textContent = "Crash!";
      messageEl.textContent = "Score: " + Math.floor(score);
      startBtn.textContent = "Race Again";
      updateHUD();
    }

    function spawnTraffic() {
      const laneWidth = road.width / road.laneCount;
      const lane = Math.floor(Math.random() * road.laneCount);
      const x = road.left + lane * laneWidth + laneWidth / 2;

      traffic.push({
        x,
        y: -80,
        w: 34,
        h: 62,
        color: Math.random() > 0.5 ? "#ff5f6d" : "#ff8a00",
        accent: Math.random() > 0.5 ? "#d92d40" : "#ffb000",
        speed: 2 + Math.random() * 3 + road.speed * 0.2
      });
    }

    function addParticles(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 18 + Math.random() * 18,
          maxLife: 18 + Math.random() * 18,
          color
        });
      }
    }

    function rectsIntersect(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function update(dt) {
      if (!running) return;

      road.speed += 0.08 * dt * 0.06;
      road.scroll += road.speed * 0.9;
      score += 0.18 * dt * 0.06 + road.speed * 0.02;

      if (keys.left) player.velX -= 0.45;
      if (keys.right) player.velX += 0.45;
      if (!keys.left && !keys.right) player.velX *= 0.8;

      player.velX = clamp(player.velX, -6, 6);
      player.x += player.velX;

      if (keys.boost && player.boost > 0) {
        player.boost -= 1.2;
        road.speed += 0.05;
      } else {
        player.boost += 0.3;
      }
      player.boost = clamp(player.boost, 0, 100);

      const minX = road.left + 10;
      const maxX = road.left + road.width - 10;
      player.x = clamp(player.x, minX, maxX);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTraffic();
        spawnTimer = clamp(1100 - road.speed * 14, 420, 1100);
      }

      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.y += (road.speed * 0.8) + car.speed;

        if (car.y > canvas.height + 100) {
          traffic.splice(i, 1);
          continue;
        }

        const playerBox = {
          x: player.x - player.w / 2,
          y: player.y - player.h / 2,
          w: player.w,
          h: player.h
        };

        const enemyBox = {
          x: car.x - car.w / 2,
          y: car.y - car.h / 2,
          w: car.w,
          h: car.h
        };

        if (rectsIntersect(playerBox, enemyBox)) {
          addParticles(player.x, player.y, "#ff6b6b", 30);
          endGame();
          return;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (score > best) {
        best = score;
        localStorage.setItem("neon_racer_best", String(best));
      }

      updateHUD();
    }

    function drawRoad() {
      ctx.fillStyle = "#07111e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0c5b3f";
      ctx.fillRect(0, 0, road.left, canvas.height);
      ctx.fillRect(road.left + road.width, 0, canvas.width - (road.left + road.width), canvas.height);

      ctx.fillStyle = "#1d2431";
      ctx.fillRect(road.left, 0, road.width, canvas.height);

      const stripeHeight = 46;
      const gap = 26;
      const offset = (road.scroll * 1.2) % (stripeHeight + gap);

      ctx.fillStyle = "rgba(255,255,255,0.2)";
      for (let i = -1; i < 20; i++) {
        const y = i * (stripeHeight + gap) - offset;
        ctx.fillRect(road.left + road.width / 3, y, 6, stripeHeight);
        ctx.fillRect(road.left + (road.width * 2) / 3, y, 6, stripeHeight);
      }

      ctx.fillStyle = "#edf7ff";
      ctx.fillRect(road.left, 0, 4, canvas.height);
      ctx.fillRect(road.left + road.width - 4, 0, 4, canvas.height);
    }

    function drawCar(x, y, w, h, color, accent) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillRect(x + 7, y + 8, w - 14, h * 0.28);

      ctx.fillStyle = accent;
      ctx.fillRect(x + 6, y + 14, w - 12, 12);

      ctx.fillStyle = "#131b28";
      ctx.fillRect(x + 5, y + 4, 7, 14);
      ctx.fillRect(x + w - 12, y + 4, 7, 14);
      ctx.fillRect(x + 5, y + h - 18, 7, 14);
      ctx.fillRect(x + w - 12, y + h - 18, 7, 14);
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }
      ctx.globalAlpha = 1;
    }

    function drawBoostMeter() {
      const x = 18;
      const y = canvas.height - 26;
      const w = 120;
      const h = 10;

      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = "#ffd166";
      ctx.fillRect(x, y, (player.boost / 100) * w, h);

      ctx.strokeStyle = "rgba(255,255,255,0.32)";
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = "#edf7ff";
      ctx.font = "12px Arial";
      ctx.fillText("BOOST", x, y - 8);
    }

    function draw() {
      drawRoad();

      for (const car of traffic) {
        drawCar(car.x - car.w / 2, car.y - car.h / 2, car.w, car.h, car.color, car.accent);
      }

      drawCar(player.x - player.w / 2, player.y - player.h / 2, player.w, player.h, "#35d5ff", "#0ea5d8");
      drawParticles();
      drawBoostMeter();
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = timestamp - lastTime;
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a") keys.left = true;
      if (k === "arrowright" || k === "d") keys.right = true;
      if (k === " " || k === "w") {
        e.preventDefault();
        keys.boost = true;
      }
    });

    document.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a") keys.left = false;
      if (k === "arrowright" || k === "d") keys.right = false;
      if (k === " " || k === "w") keys.boost = false;
    });

    startBtn.addEventListener("click", startGame);

    updateHUD();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
